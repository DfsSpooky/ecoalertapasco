services:
  db:
    image: postgres:15-alpine
    container_name: ecoalerta_db
    environment:
      POSTGRES_DB: ecoalerta
      POSTGRES_USER: ecoalerta_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecoalerta_secure_pwd_2026}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  ecoalerta_redis:
    image: redis:7-alpine
    container_name: ecoalerta_redis
    expose:
      - "6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoalerta_backend
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-ecoalerta-production-secret-key-2026}
      - DB_HOST=db
      - DB_NAME=ecoalerta
      - DB_USER=ecoalerta_user
      - DB_PASSWORD=${DB_PASSWORD:-ecoalerta_secure_pwd_2026}
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-api.ecoalerta.duckdns.org,ecoalerta.duckdns.org,localhost,127.0.0.1,backend}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://ecoalerta.duckdns.org,https://api.ecoalerta.duckdns.org}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://ecoalerta.duckdns.org}
      - REDIS_URL=redis://ecoalerta_redis:6379/0
      - GOOGLE_CLIENT_ID=537315321668-7lf49bul2bhicko8l47vn37km7eo14sb.apps.googleusercontent.com
      - TURNSTILE_SITEKEY=${TURNSTILE_SITEKEY:-1x00000000000000000000AA}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
    depends_on:
      - db
      - ecoalerta_redis
    restart: always

  frontend:
    build:
      context: ./frontend-wasm
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=https://api.ecoalerta.duckdns.org
    environment:
      - BACKEND_URL=https://api.ecoalerta.duckdns.org
    container_name: ecoalerta_frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  media_data:
