services:
  db:
    image: postgres:15-alpine
    container_name: ecoalerta_db
    environment:
      POSTGRES_DB: ecoalerta
      POSTGRES_USER: ecoalerta_user
      POSTGRES_PASSWORD: ecoalerta_secure_pwd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  ecoalerta_redis:
    image: redis:7-alpine
    container_name: ecoalerta_redis
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoalerta_backend
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-development-secret-key-12345
      - DB_HOST=db
      - DB_NAME=ecoalerta
      - DB_USER=ecoalerta_user
      - DB_PASSWORD=ecoalerta_secure_pwd
      - DB_PORT=5432
      - REDIS_URL=redis://ecoalerta_redis:6379/0
      - GOOGLE_CLIENT_ID=537315321668-7lf49bul2bhicko8l47vn37km7eo14sb.apps.googleusercontent.com
    depends_on:
      - db
      - ecoalerta_redis
    restart: always

  frontend:
    build:
      context: ./frontend-wasm
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://localhost:8000
    environment:
      - BACKEND_URL=http://localhost:8000
    container_name: ecoalerta_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  media_data:
