[package]
name = "frontend-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6.15", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = [
    "CloseEvent",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlDialogElement",
    "DomRect",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "WebSocket",
    "Window",
    "Document",
    "Storage",
    "Location",
    "console"
] }
gloo-net = "0.5"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
