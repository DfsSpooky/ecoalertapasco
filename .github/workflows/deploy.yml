name: EcoAlerta CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CI BACKEND (Python / Django)
  # ============================================================================
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verificar configuración de Django
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-secret-key-for-automated-github-tests"
        run: |
          cd backend
          python manage.py check

      - name: Ejecutar pruebas unitarias de Django
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-secret-key-for-automated-github-tests"
        run: |
          cd backend
          python manage.py test alerts

  # ============================================================================
  # 2. CI FRONTEND (Rust / Leptos WebAssembly)
  # ============================================================================
  frontend-ci:
    name: Rust WASM Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Rust y Target WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache de dependencias Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            frontend-wasm/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('frontend-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Verificar compilación WebAssembly (cargo check)
        run: |
          cargo check --manifest-path frontend-wasm/Cargo.toml --target wasm32-unknown-unknown

  # ============================================================================
  # 3. CD DESPLIEGUE A PRODUCCIÓN (Coolify Webhook)
  # ============================================================================
  deploy:
    name: Deploy to Production
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Notificar y Disparar Despliegue en Coolify
        run: |
          echo "🚀 Pipeline de integración continua aprobado al 100% (Backend Django + Frontend Rust WASM)."
          
          # Si configuraste el Webhook de Coolify en GitHub Secrets:
          if [ -n "${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}" ]; then
            echo "📡 Disparando despliegue automático en Coolify..."
            curl -f -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}"
            echo "✅ Señal de despliegue enviada exitosamente a Coolify."
          else
            echo "ℹ️ COOLIFY_DEPLOY_WEBHOOK_URL no configurado aún en GitHub Secrets."
            echo "ℹ️ Una vez añadido en Settings > Secrets, el despliegue tras cada commit será 100% automático."
          fi
